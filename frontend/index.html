<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>问卷系统</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ============================================================
       NAVIGATION BAR
  ============================================================ -->
  <header id="nav-bar" class="hidden">
    <div class="nav-brand">📋 问卷系统</div>
    <nav>
      <button class="nav-btn" id="nav-dashboard">我的问卷</button>
      <button class="nav-btn" id="nav-create">创建问卷</button>
      <button class="nav-btn" id="nav-bank">题库</button>
      <button class="nav-btn" id="nav-logout">退出登录</button>
    </nav>
  </header>

  <main id="app" class="container">
    <!-- ============================================================
         VIEW: LOGIN / REGISTER
    ============================================================ -->
    <section id="view-auth" class="view">
      <div class="auth-box">
        <h1>问卷系统</h1>
        <div class="auth-tabs">
          <button class="tab-btn active" data-tab="login">登录</button>
          <button class="tab-btn" data-tab="register">注册</button>
        </div>

        <form id="form-login" class="auth-form">
          <div class="form-group">
            <label for="login-username">用户名</label>
            <input id="login-username" type="text" placeholder="输入用户名" autocomplete="username" required />
          </div>
          <div class="form-group">
            <label for="login-password">密码</label>
            <input id="login-password" type="password" placeholder="输入密码" autocomplete="current-password" required />
          </div>
          <button type="submit" class="btn primary">登录</button>
          <div class="form-error hidden" id="login-error"></div>
        </form>

        <form id="form-register" class="auth-form hidden">
          <div class="form-group">
            <label for="reg-username">用户名</label>
            <input id="reg-username" type="text" placeholder="3-32位，字母数字下划线" autocomplete="username" required />
          </div>
          <div class="form-group">
            <label for="reg-password">密码</label>
            <input id="reg-password" type="password" placeholder="输入密码" autocomplete="new-password" required />
          </div>
          <button type="submit" class="btn primary">注册</button>
          <div class="form-error hidden" id="reg-error"></div>
        </form>
      </div>
    </section>

    <!-- ============================================================
         VIEW: DASHBOARD (my surveys)
    ============================================================ -->
    <section id="view-dashboard" class="view hidden">
      <h2>我的问卷</h2>
      <div id="survey-list"></div>
    </section>

    <!-- ============================================================
         VIEW: BANK (题库 / 可复用题目)
    ============================================================ -->
    <section id="view-bank" class="view hidden">
      <div class="editor-header">
        <button class="btn secondary" id="btn-bank-back">← 返回列表</button>
        <h2>题库</h2>
        <button class="btn primary" id="btn-bank-new">＋ 新建题目</button>
      </div>

      <div class="bank-toolbar">
        <input id="bank-search" type="text" placeholder="搜索题干关键字…" />
        <select id="bank-scope">
          <option value="all">全部可见</option>
          <option value="mine">我创建的</option>
          <option value="shared">共享给我的</option>
        </select>
        <label class="inline-label">
          <input id="bank-only" type="checkbox" />
          仅显示题库中的题目
        </label>
      </div>

      <div id="bank-list"></div>
    </section>

    <!-- ============================================================
         VIEW: CREATE / EDIT SURVEY
    ============================================================ -->
    <section id="view-editor" class="view hidden">
      <div class="editor-header">
        <button class="btn secondary" id="btn-back-list">← 返回列表</button>
        <h2 id="editor-title">创建问卷</h2>
        <button class="btn primary" id="btn-publish-survey">发布问卷</button>
      </div>

      <form id="form-survey-meta">
        <div class="form-group">
          <label for="survey-title">问卷标题</label>
          <input id="survey-title" type="text" placeholder="问卷标题" required />
        </div>
        <div class="form-group">
          <label for="survey-desc">描述</label>
          <textarea id="survey-desc" rows="3" placeholder="问卷描述（可选）"></textarea>
        </div>
        <div class="form-group">
          <label>
            <input id="survey-anon" type="checkbox" />
            匿名收集（不向问卷发布者公开填写人用户名）
          </label>
          <p class="meta" style="margin:4px 0 0 24px;font-size:.8rem">注：所有填表者均需先登录账号。勾选此项仅隐藏统计页中的用户名，答案仍会被记录并归属到账号。</p>
        </div>
        <button type="submit" class="btn secondary" id="btn-save-meta">保存基本信息</button>
      </form>

      <hr />

      <!-- Question list -->
      <h3>题目</h3>
      <div id="question-list"></div>

      <!-- Add question form -->
      <div class="add-question-box">
        <h4>添加题目</h4>
        <div class="form-group">
          <label for="q-type">题型</label>
          <select id="q-type">
            <option value="single">单选题</option>
            <option value="multi">多选题</option>
            <option value="text">文本题</option>
            <option value="number">数字题</option>
          </select>
        </div>
        <div class="form-group">
          <label for="q-title">题目文本</label>
          <input id="q-title" type="text" placeholder="题目内容" />
        </div>
        <div class="form-group">
          <label>
            <input id="q-required" type="checkbox" />
            必答
          </label>
        </div>

        <!-- Options for single/multi -->
        <div id="q-options-box" class="form-group">
          <label>选项（每行一个）</label>
          <textarea id="q-options" rows="4" placeholder="选项A&#10;选项B&#10;选项C"></textarea>
        </div>

        <!-- Validation extras -->
        <div id="q-validation-box" class="form-group hidden"></div>

        <!-- Next rule -->
        <div class="form-group">
          <label for="q-next-rule">答题后跳转</label>
          <select id="q-next-rule">
            <option value="next">默认下一题</option>
            <option value="end">结束问卷</option>
            <option value="by_option">按选项跳转（单选）</option>
          </select>
        </div>

        <!-- Branches config for by_option mode -->
        <div id="q-branches-box" class="form-group hidden">
          <label>按选项跳转 — 为每个选项指定目标题号（留空则默认下一题）</label>
          <div id="q-branch-rows"></div>
        </div>

        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button type="button" class="btn primary" id="btn-add-question">添加题目</button>
          <button type="button" class="btn secondary" id="btn-pick-from-bank">📚 从题库选择</button>
        </div>
        <p class="meta" style="margin:8px 0 0 0;font-size:.8rem">
          从题库选题会保存一份题目快照：之后题库里的原题如何修改，都不会影响本问卷（需求三）。
        </p>
      </div>
    </section>

    <!-- ============================================================
         VIEW: FILL SURVEY (public)
    ============================================================ -->
    <section id="view-fill" class="view hidden">
      <div id="fill-header"></div>
      <div id="fill-progress">
        <div id="fill-progress-bar"></div>
      </div>
      <div id="fill-question"></div>
      <div id="fill-error" class="form-error hidden"></div>
    </section>

    <!-- ============================================================
         VIEW: STATISTICS (owner)
    ============================================================ -->
    <section id="view-stats" class="view hidden">
      <div class="editor-header">
        <button class="btn secondary" id="btn-back-from-stats">← 返回列表</button>
        <h2>问卷统计</h2>
      </div>
      <div id="stats-content"></div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <!-- ============================================================
       EDIT QUESTION MODAL
  ============================================================ -->
  <div id="edit-modal" class="modal hidden">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modal-title">编辑题目</h3>
        <button class="modal-close" id="modal-close-btn" aria-label="关闭">×</button>
      </div>
      <form id="form-edit-question">
        <div class="form-group">
          <label for="edit-q-type">题型</label>
          <select id="edit-q-type" disabled>
            <option value="single">单选题</option>
            <option value="multi">多选题</option>
            <option value="text">文本题</option>
            <option value="number">数字题</option>
          </select>
        </div>
        <div class="form-group">
          <label for="edit-q-title">题目文本</label>
          <input id="edit-q-title" type="text" placeholder="题目内容" required />
        </div>
        <div class="form-group">
          <label>
            <input id="edit-q-required" type="checkbox" />
            必答
          </label>
        </div>
        <div id="edit-q-options-box" class="form-group">
          <label>选项（每行一个）</label>
          <textarea id="edit-q-options" rows="4" placeholder="选项A&#10;选项B&#10;选项C"></textarea>
        </div>
        <div class="form-group">
          <label for="edit-q-next-rule">答题后跳转</label>
          <select id="edit-q-next-rule">
            <option value="next">默认下一题</option>
            <option value="end">结束问卷</option>
            <option value="by_option">按选项跳转（单选）</option>
          </select>
        </div>

        <!-- Branches config for by_option mode in edit modal -->
        <div id="edit-q-branches-box" class="form-group hidden">
          <label>按选项跳转 — 为每个选项指定目标题号（留空则默认下一题）</label>
          <div id="edit-q-branch-rows"></div>
        </div>

        <div id="edit-q-bank-box" class="form-group hidden">
          <label for="edit-q-bank-version">题库来源版本</label>
          <select id="edit-q-bank-version"></select>
          <p class="meta" style="margin:4px 0 0 0;font-size:.8rem">
            该题来自题库。切换到别的版本会更新本问卷中这道题的快照内容，不影响其他问卷（需求五）。
          </p>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn danger small" id="btn-delete-question">删除题目</button>
          <button type="submit" class="btn primary">保存修改</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ============================================================
       BANK MODAL — 新建 / 修改题目（修改会生成新版本）
  ============================================================ -->
  <div id="bank-modal" class="modal hidden">
    <div class="modal-backdrop" id="bank-modal-backdrop"></div>
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="bank-modal-title">新建题目</h3>
        <button class="modal-close" id="bank-modal-close" aria-label="关闭">×</button>
      </div>
      <form id="form-bank-question">
        <div class="form-group">
          <label for="bank-q-type">题型</label>
          <select id="bank-q-type">
            <option value="single">单选题</option>
            <option value="multi">多选题</option>
            <option value="text">文本题</option>
            <option value="number">数字题</option>
          </select>
        </div>
        <div class="form-group">
          <label for="bank-q-title">题目文本</label>
          <input id="bank-q-title" type="text" placeholder="题目内容" required />
        </div>
        <div class="form-group">
          <label>
            <input id="bank-q-required" type="checkbox" />
            必答
          </label>
        </div>
        <div id="bank-q-options-box" class="form-group">
          <label>选项（每行一个）</label>
          <textarea id="bank-q-options" rows="4" placeholder="选项A&#10;选项B&#10;选项C"></textarea>
        </div>
        <div class="form-group">
          <label for="bank-q-tags">标签（逗号分隔，用于题库分类）</label>
          <input id="bank-q-tags" type="text" placeholder="人口学, 通用" />
        </div>
        <div class="form-group">
          <label for="bank-q-visibility">可见性</label>
          <select id="bank-q-visibility">
            <option value="private">仅自己可见</option>
            <option value="public">公开（所有人可使用）</option>
          </select>
        </div>
        <div class="form-group">
          <label>
            <input id="bank-q-in-bank" type="checkbox" checked />
            加入题库
          </label>
        </div>
        <div class="form-group">
          <label for="bank-q-note">改动说明</label>
          <input id="bank-q-note" type="text" placeholder="例如：新增了 26-35 岁选项" />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" id="bank-modal-cancel">取消</button>
          <button type="submit" class="btn primary" id="bank-modal-submit">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ============================================================
       BANK PICKER MODAL — 从题库选题
  ============================================================ -->
  <div id="bank-picker-modal" class="modal hidden">
    <div class="modal-backdrop" id="bank-picker-backdrop"></div>
    <div class="modal-box">
      <div class="modal-header">
        <h3>从题库选择题目</h3>
        <button class="modal-close" id="bank-picker-close" aria-label="关闭">×</button>
      </div>
      <div class="form-group">
        <input id="bank-picker-search" type="text" placeholder="搜索题干关键字…" />
      </div>
      <div id="bank-picker-list"></div>
      <div class="modal-actions">
        <button type="button" class="btn secondary" id="bank-picker-cancel">取消</button>
      </div>
    </div>
  </div>

  <!-- ============================================================
       BANK DETAIL MODAL — 版本历史 / 使用情况 / 跨问卷统计 / 共享
  ============================================================ -->
  <div id="bank-detail-modal" class="modal hidden">
    <div class="modal-backdrop" id="bank-detail-backdrop"></div>
    <div class="modal-box wide">
      <div class="modal-header">
        <h3 id="bank-detail-title">题目详情</h3>
        <button class="modal-close" id="bank-detail-close" aria-label="关闭">×</button>
      </div>
      <div id="bank-detail-body"></div>
      <div class="modal-actions">
        <button type="button" class="btn secondary" id="bank-detail-close-2">关闭</button>
      </div>
    </div>
  </div>

  <!-- ============================================================
       BANK USE MODAL — 把题库题目加入某个问卷
  ============================================================ -->
  <div id="bank-use-modal" class="modal hidden">
    <div class="modal-backdrop" id="bank-use-backdrop"></div>
    <div class="modal-box">
      <div class="modal-header">
        <h3>添加到问卷</h3>
        <button class="modal-close" id="bank-use-close" aria-label="关闭">×</button>
      </div>
      <div class="form-group">
        <label for="bank-use-survey">选择问卷</label>
        <select id="bank-use-survey"></select>
      </div>
      <p class="meta" style="margin:0 0 12px 0;font-size:.8rem">
        同一道题可以加入多个问卷；每个问卷保存各自的题目快照，互不影响。
      </p>
      <div class="modal-actions">
        <button type="button" class="btn secondary" id="bank-use-cancel">取消</button>
        <button type="button" class="btn primary" id="bank-use-confirm">添加</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="bank.js"></script>
</body>
</html>
